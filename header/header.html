<!-- header.html -->
<header class="app-header">
  <div class="header-inner">
    <div class="logo-block">
      <!-- Logo SVG -->
      <div class="logo-icon">
        <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="18" cy="18" r="16" stroke="white" stroke-width="2.5"/>
          <circle cx="18" cy="18" r="8" stroke="white" stroke-width="2"/>
          <circle cx="18" cy="18" r="3" fill="white"/>
          <line x1="18" y1="2" x2="18" y2="8" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <line x1="18" y1="28" x2="18" y2="34" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <line x1="2" y1="18" x2="8" y2="18" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <line x1="28" y1="18" x2="34" y2="18" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      
      <!-- Título MF con M blanca y F verde -->
      <div class="app-title">
        <span class="m">M</span><span class="f">F</span>
      </div>
      
      <!-- Separador vertical -->
      <div class="title-separator"></div>
      
      <!-- Texto del negocio -->
      <div class="app-brand-text">
        <div class="app-brand-main">
          MANTENIMIENTO EN<span class="highlight"> FRENOS</span>
        </div>
        <div class="app-subtitle">Sistema de Gestión · Quito</div>
      </div>
    </div>
    
    <div class="header-meta">
      <span class="meta-date" id="headerDate"></span>
      <span class="meta-badge">v1.0</span>
    </div>
  </div>
</header>
