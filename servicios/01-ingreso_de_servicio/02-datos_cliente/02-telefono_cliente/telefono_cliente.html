<div class="form-group form-field-phone">
  <label for="servTelefonoCliente">
    <span class="field-icon">📱</span> Teléfono del Cliente *
  </label>
  <input 
    type="tel" 
    id="servTelefonoCliente" 
    placeholder="Ej: 0998123456" 
    pattern="[0-9]{10}" 
    title="Ingresa exactamente 10 dígitos numéricos"
    inputmode="numeric"
    autocomplete="tel"
    required 
  />
  <span class="field-hint">Solo 10 dígitos, sin espacios ni guiones</span>
</div>
